name: Binaries Publisher

run-name: Binaries Publisher | ${{ github.event_name }} by ${{ github.actor }} on '${{ github.ref_name }}'

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  publish:
    name: Publishing for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macos
            target: x86_64-apple-darwin
            architecture: x86_64
            binary-postfix: ""
            binary-name: vimstoat
            use-cross: false
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
            binary-postfix: ""
            binary-name: vimstoat
            use-cross: false
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            binary-postfix: ""
            binary-name: vimstoat
            use-cross: false
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-musl
            architecture: x86_64-musl
            binary-postfix: ""
            binary-name: vimstoat
            use-cross: true
          - os: ubuntu-latest
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            binary-postfix: ""
            binary-name: vimstoat
            use-cross: true
          - os: ubuntu-latest
            os-name: linux
            target: aarch64-unknown-linux-musl
            architecture: arm64-musl
            binary-postfix: ""
            binary-name: vimstoat
            use-cross: true
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            architecture: x86_64
            binary-postfix: ".exe"
            binary-name: vimstoat
            use-cross: false
          - os: windows-latest
            os-name: windows
            target: aarch64-pc-windows-msvc
            architecture: arm64
            binary-postfix: ".exe"
            binary-name: vimstoat
            use-cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cargo build
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Packaging final binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          BINARY_NAME="${{ matrix.binary-name }}${{ matrix.binary-postfix }}"
          RELEASE_NAME="${{ matrix.binary-name }}-${{ github.ref_name }}-${{ matrix.os-name }}-${{ matrix.architecture }}"

          # Create archive with binary, README, and LICENSE
          cp ../../../README.md . 2>/dev/null || true
          cp ../../../LICENSE . 2>/dev/null || true

          tar -czvf "$RELEASE_NAME.tar.gz" "$BINARY_NAME" README.md LICENSE

          # Generate SHA256 checksum
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile "$RELEASE_NAME.tar.gz" sha256 | grep -E "[A-Fa-f0-9]{64}" > "$RELEASE_NAME.sha256"
          elif command -v sha256sum &> /dev/null; then
            sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"
          else
            shasum -a 256 "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"
          fi

      - name: Releasing assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
