name: Binaries Publisher

run-name: Binaries Publisher | ${{ github.event_name }} by ${{ github.actor }} on '${{ github.ref_name }}'

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: ""


permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    name: Publishing for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macos
            target: x86_64-apple-darwin
            architecture: x86_64
            binary-postfix: ""
            binary-name: vimstoat

          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
            binary-postfix: ""
            binary-name: vimstoat

          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            binary-postfix: ""
            binary-name: vimstoat

          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-musl
            architecture: x86_64-musl
            binary-postfix: ""
            binary-name: vimstoat
          
          - os: ubuntu-24.04-arm
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            binary-postfix: ""
            binary-name: vimstoat

          - os: ubuntu-24.04-arm
            os-name: linux
            target: aarch64-unknown-linux-musl
            architecture: arm64-musl
            binary-postfix: ""
            binary-name: vimstoat

          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            architecture: x86_64
            binary-postfix: ".exe"
            binary-name: vimstoat

          - os: windows-latest
            os-name: windows
            target: aarch64-pc-windows-msvc
            architecture: arm64
            binary-postfix: ".exe"
            binary-name: vimstoat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl-tools
        if: matrix.os-name == 'linux' && contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cargo build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Packaging final binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          BINARY_NAME="${{ matrix.binary-name }}${{ matrix.binary-postfix }}"
          RELEASE_NAME="${{ matrix.binary-name }}-${{ inputs.tag || github.ref_name }}-${{ matrix.os-name }}-${{ matrix.architecture }}"

          # Create archive with binary, README, and LICENSE
          cp ../../../README.md . 2>/dev/null || true
          cp ../../../LICENSE . 2>/dev/null || true

          tar -czvf "$RELEASE_NAME.tar.gz" "$BINARY_NAME" README.md LICENSE

          # Generate SHA256 checksum
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile "$RELEASE_NAME.tar.gz" sha256 | grep -E "[A-Fa-f0-9]{64}" > "$RELEASE_NAME.sha256"
          elif command -v sha256sum &> /dev/null; then
            sha256sum "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"
          else
            shasum -a 256 "$RELEASE_NAME.tar.gz" > "$RELEASE_NAME.sha256"
          fi

      - name: Releasing assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          files: |
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
